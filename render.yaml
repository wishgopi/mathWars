services:
  - type: web
    name: mathwars-api
    env: node
    rootDir: src/backend
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # IMPORTANT: Set DATABASE_URL in the Render Dashboard for this service (do not commit secrets here)
